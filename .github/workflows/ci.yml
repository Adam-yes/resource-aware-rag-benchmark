name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt
      - name: Install
        run: python -m pip install -r code/requirements.txt
      - name: README figures
        run: python docs/assets/make_figures.py && git diff --exit-code docs/assets
      - name: Tests
        working-directory: code
        env:
          RAGBENCH_FAKE: "1"
        run: python -m pytest -q tests
