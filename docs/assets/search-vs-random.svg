<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="t d">
<title id="t">Search methods compared with random search</title>
<desc id="d">Inside the lookup table, the genetic algorithm, TPE and coordinate ascent close the gap to the best configuration faster than random search. On held-out manuals none of them beats random search.</desc>

<style>
  svg { --bg:#fcfcfb; --plane:#f4f4f1; --ink:#0b0b0b; --ink2:#52514e; --mute:#898781;
        --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
        --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --dot:#c9c8c1; --soft:#e7f0fb; }
  @media (prefers-color-scheme: dark) {
    svg { --bg:#1a1a19; --plane:#222220; --ink:#f0efec; --ink2:#c3c2b7; --mute:#898781;
          --grid:#2c2c2a; --axis:#46463f; --border:rgba(255,255,255,.10);
          --s1:#3987e5; --s2:#d95926; --s3:#199e70; --dot:#4f4e49; --soft:#1c2a3c; }
  }
  text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
  .t-title { font-size: 26px; font-weight: 650; }
  .t-sub { font-size: 15.5px; fill: var(--ink2); }
  .t-h { font-size: 16px; font-weight: 600; }
  .t-lab { font-size: 13.5px; fill: var(--ink2); }
  .t-small { font-size: 12.5px; fill: var(--mute); }
  .t-tick { font-size: 12.5px; fill: var(--mute); font-variant-numeric: tabular-nums; }
  .t-strong { font-size: 13.5px; font-weight: 600; }
  .t-kpi { font-size: 38px; font-weight: 650; }
  .card { fill: var(--bg); stroke: var(--border); stroke-width: 1; }
  .plane { fill: var(--plane); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .lead { stroke: var(--mute); stroke-width: 1; fill: none; }
  .dot { fill: var(--dot); }
  .ring { stroke: var(--bg); stroke-width: 2; }
  .f-s1 { fill: var(--s1); } .st-s1 { stroke: var(--s1); }
  .f-s2 { fill: var(--s2); } .st-s2 { stroke: var(--s2); }
  .f-s3 { fill: var(--s3); } .st-s3 { stroke: var(--s3); }
  .f-mute { fill: var(--mute); } .st-mute { stroke: var(--mute); }
  .f-ink { fill: var(--ink); } .st-ink { stroke: var(--ink); }
  .f-soft { fill: var(--soft); }
  .line { fill: none; stroke-width: 2.25; stroke-linejoin: round; stroke-linecap: round; }
  .box { fill: var(--bg); stroke: var(--axis); stroke-width: 1; }
  .box-hi { fill: var(--soft); stroke: var(--s1); stroke-width: 1.25; }
  .arrow { stroke: var(--mute); stroke-width: 1.5; fill: none; }
  .halo { paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
</style>
<rect class="card" x="0.5" y="0.5" width="1199" height="599" rx="14"/>
<text x="40.0" y="52.0" class="t-title" text-anchor="start">Search beats random sampling inside the table, but not on unseen manuals</text>
<text x="40.0" y="80.0" class="t-sub" text-anchor="start">Left: replay on the complete lookup table, 50 seeds per method. Right: the same methods validated by leaving one manual out.</text>
<text x="40.0" y="124.0" class="t-h" text-anchor="start">Inside the benchmark table</text>
<path class="grid" d="M96,504.0 H560"/>
<text x="86.0" y="508.0" class="t-tick" text-anchor="end">0.00</text>
<path class="grid" d="M96,405.7 H560"/>
<text x="86.0" y="409.7" class="t-tick" text-anchor="end">0.01</text>
<path class="grid" d="M96,307.3 H560"/>
<text x="86.0" y="311.3" class="t-tick" text-anchor="end">0.02</text>
<path class="grid" d="M96,209.0 H560"/>
<text x="86.0" y="213.0" class="t-tick" text-anchor="end">0.03</text>
<text x="96.0" y="524.0" class="t-tick" text-anchor="middle">25</text>
<text x="188.8" y="524.0" class="t-tick" text-anchor="middle">50</text>
<text x="374.4" y="524.0" class="t-tick" text-anchor="middle">100</text>
<text x="560.0" y="524.0" class="t-tick" text-anchor="middle">150</text>
